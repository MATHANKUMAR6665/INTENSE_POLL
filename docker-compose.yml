version: '3.8'

services:
  # MongoDB for permanent persistence
  mongodb:
    image: mongo:7.0
    container_name: syncpoll-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: syncpoll
    volumes:
      - mongo_data:/data/db

  # Redis for real-time Pub/Sub and atomic vote counters
  redis:
    image: redis:7.2-alpine
    container_name: syncpoll-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Go Gin Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: syncpoll-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=syncpoll
      - REDIS_URI=redis://redis:6379
      - JWT_SECRET=syncpoll_super_secret_guvi_hcl_key_2026
      - CORS_ORIGIN=*
    depends_on:
      - mongodb
      - redis

  # React Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: syncpoll-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
